; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[platformio]
default_envs = esp12e_arm64

[env:esp12e]
platform = espressif8266
board = esp12e
framework = arduino
lib_deps =
	knolleary/PubSubClient@^2.8
	bblanchon/ArduinoJson@^7.4.2
	adafruit/Adafruit MPU6050@^2.2.6
upload_speed = 115200
monitor_speed = 115200

; PlatformIO's registry Xtensa compiler is x86_64 on macOS. Use this native
; Apple Silicon build when building on macOS arm64 without Rosetta.
[env:esp12e_arm64]
extends = env:esp12e
platform_packages =
	toolchain-xtensa @ https://github.com/esphome-libs/xtensa-lx106-elf-toolchain/releases/download/10.3.0-esphome.3/toolchain-xtensa-lx106-elf-10.3.0-esphome.3-darwin_arm64.tar.gz
