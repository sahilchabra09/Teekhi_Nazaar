[env:esp12e]
platform = espressif8266
board = esp12e
framework = arduino
monitor_speed = 115200
lib_deps =
    knolleary/PubSubClient@^2.8
    bblanchon/ArduinoJson@^7.4.2

; Native compiler for Apple Silicon, matching the robot build.
[env:esp12e_arm64]
extends = env:esp12e
platform_packages =
    toolchain-xtensa @ https://github.com/esphome-libs/xtensa-lx106-elf-toolchain/releases/download/10.3.0-esphome.3/toolchain-xtensa-lx106-elf-10.3.0-esphome.3-darwin_arm64.tar.gz
